<div class="table-container">

    <div class="table-header">
        <h2>Contacts</h2>
        <button class="btn-add" type="button" (click)="addNew()">+ Add Contact</button>
    </div>

    <table class="contact-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            @for (item of items(); track item.id) {
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.status }}</td>
            </tr>
            }


        </tbody>
    </table>

</div>
